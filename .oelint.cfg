# oelint-adv configuration (read automatically from the repository root).
#
# Suppressed rules conflict with deliberate choices of this layer:
#  - insaneskip:          EPICS installs under /epics and /epics-modules, which
#                         needs INSANE_SKIP libdir.
#  - task.nocopy:         "cp -a" is used to keep EPICS library symlinks.
#  - bbclass.underscores: the existing class is named epics-module.bbclass.
#  - file.patchsignedoff: patches are not required to carry a Signed-off-by.
[oelint]
release = wrynose
suppress =
  oelint.vars.insaneskip
  oelint.task.nocopy
  oelint.bbclass.underscores
  oelint.file.patchsignedoff
