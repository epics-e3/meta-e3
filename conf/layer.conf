# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-e3"
BBFILE_PATTERN_meta-e3 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-e3 = "5"

LAYERDEPENDS_meta-e3 = "core"
LAYERSERIES_COMPAT_meta-e3 = "wrynose"

# EPICS_LICENSE is not a generic license shipped by oe-core.
LICENSE_PATH += "${LAYERDIR}/custom-licenses"
