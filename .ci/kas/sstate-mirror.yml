# Overlay for the build job. Use as base.yml:sstate-mirror.yml
#
# kirkstone has no OE_FRAGMENTS / core/yocto/sstate-mirror-cdn fragment, so
# the Yocto Project sstate mirror and hash equivalence server are set
# explicitly.
header:
  version: 23

local_conf_header:
  sstate-mirror: |
    BB_SIGNATURE_HANDLER = "OEEquivHash"
    BB_HASHSERVE = "auto"
    BB_HASHSERVE_UPSTREAM = "hashserv.yoctoproject.org:8686"
    SSTATE_MIRRORS ?= "file://.* https://sstate.yoctoproject.org/all/PATH;downloadfilename=PATH"
  disk: |
    INHERIT += "rm_work"
    # Stop cleanly instead of failing randomly when the runner runs out of disk.
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K"
